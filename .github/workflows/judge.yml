name: Judge Submission

on:
  repository_dispatch:
    types: [judge-submission]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.set_result.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GCC (C/C++)
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Write submission data
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > submission.json
          node -e "
            const p = require('./submission.json');
            const fs = require('fs');
            const ext = { c: 'c', cpp: 'cpp', python3: 'py', java: 'java', javascript: 'js', typescript: 'ts', rust: 'rs', go: 'go' };
            const e = ext[p.language] || p.language;
            const fname = p.language === 'java' ? 'Main.java' : ('solution.' + e);
            fs.writeFileSync(fname, p.code);
            console.log('Wrote', fname, 'length', p.code.length);
          "

      - name: Run judge
        id: judge
        run: node .github/scripts/judge.js submission.json 2>&1 | tee judge_output.log
        continue-on-error: true

      - name: Capture compiler output
        if: always()
        run: |
          if [ -f judge_output.log ]; then
            echo "COMPILER_OUTPUT<<EOF" >> $GITHUB_ENV
            cat judge_output.log >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Upload result to API
        if: always() # 无论评测成功还是失败都执行
        env:
          COMPILER_OUTPUT: ${{ env.COMPILER_OUTPUT }}
          SUB_ID: ${{ github.event.client_payload.submissionId }}
          PROBLEM_ID: ${{ github.event.client_payload.problemId }}
          USER_ID: ${{ github.event.client_payload.userId }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -f judge_output.txt ]; then
            JUDGE_OUTPUT=$(cat judge_output.txt)
          else
            JUDGE_OUTPUT='{"status":"runtime_error","details":{"passed":false,"error":"No judge output"}}'
          fi
          
          echo "Judge output: $JUDGE_OUTPUT"
          node -e "
            const judgeOutput = process.env.JUDGE_OUTPUT || '{}';
            const compilerOutput = process.env.COMPILER_OUTPUT || '';
            
            let result;
            try {
              result = JSON.parse(judgeOutput);
            } catch (e) {
              console.error('Failed to parse judge output:', e);
              result = { status: 'runtime_error', details: { passed: false, error: 'Judge output parse error' } };
            }
            
            // 确保details字段存在
            if (!result.details) {
              result.details = { passed: false, details: [] };
            }
            
            // 将编译器输出添加到 result.details 中
            if (compilerOutput) {
              result.details.compilerOutput = compilerOutput;
            }
            
            const body = {
              submissionId: Number(process.env.SUB_ID),
              problemId: Number(process.env.PROBLEM_ID),
              userId: Number(process.env.USER_ID),
              status: result.status || 'runtime_error',
              resultJson: JSON.stringify(result.details),
              runTimeMs: result.runTimeMs || null,
              memoryKb: result.memoryKb || null,
              accepted: result.status === 'accepted'
            };
            console.log('Sending result to API:', JSON.stringify(body));
            
            const https = require('https');
            const data = JSON.stringify(body);
            
            const options = {
              hostname: 'api.csp.qzz.io',
              port: 443,
              path: '/api/webhooks/judge',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Content-Length': data.length,
                'Authorization': 'Bearer ' + process.env.API_TOKEN
              }
            };
            
            const req = https.request(options, (res) => {
              console.log('API response status:', res.statusCode);
              let responseData = '';
              res.on('data', (chunk) => responseData += chunk);
              res.on('end', () => console.log('API response:', responseData));
            });
            
            req.on('error', (e) => console.error('API request error:', e.message));
            req.write(data);
            req.end();
          "
