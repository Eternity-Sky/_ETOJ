name: Judge Submission

on:
  repository_dispatch:
    types: [judge-submission]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.set_result.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        if: ${{ github.event.client_payload.language == 'python3' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        if: ${{ github.event.client_payload.language == 'java' }}
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Rust
        if: ${{ github.event.client_payload.language == 'rust' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        if: ${{ github.event.client_payload.language == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install GCC (C/C++)
        if: ${{ github.event.client_payload.language == 'c' || github.event.client_payload.language == 'cpp' }}
        run: sudo apt-get update && sudo apt-get install -y gcc g++

      - name: Write submission data
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > submission.json
          node -e "
            const p = require('./submission.json');
            const fs = require('fs');
            const ext = { c: 'c', cpp: 'cpp', python3: 'py', java: 'java', javascript: 'js', typescript: 'ts', rust: 'rs', go: 'go' };
            const e = ext[p.language] || p.language;
            const fname = p.language === 'java' ? 'Main.java' : ('solution.' + e);
            fs.writeFileSync(fname, p.code);
            console.log('Wrote', fname, 'length', p.code.length);
          "

      - name: Run judge
        id: judge
        run: node .github/scripts/judge.js submission.json
        continue-on-error: true

      - name: Upload result to API
        env:
          JUDGE_RESULT: ${{ steps.judge.outputs.result }}
          SUB_ID: ${{ github.event.client_payload.submissionId }}
          PROBLEM_ID: ${{ github.event.client_payload.problemId }}
          USER_ID: ${{ github.event.client_payload.userId }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "Judge result: $JUDGE_RESULT"
          node -e "
            const result = JSON.parse(process.env.JUDGE_RESULT || '{}');
            const body = {
              submissionId: Number(process.env.SUB_ID),
              problemId: Number(process.env.PROBLEM_ID),
              userId: Number(process.env.USER_ID),
              status: result.status || 'runtime_error',
              resultJson: JSON.stringify(result.details || {}),
              runTimeMs: result.runTimeMs || null,
              memoryKb: result.memoryKb || null,
              accepted: result.status === 'accepted'
            };
            console.log('Sending result to API:', JSON.stringify(body));
            
            const https = require('https');
            const data = JSON.stringify(body);
            
            const options = {
              hostname: 'api.csp.qzz.io',
              port: 443,
              path: '/api/webhooks/judge',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Content-Length': data.length,
                'Authorization': 'Bearer ' + process.env.API_TOKEN
              }
            };
            
            const req = https.request(options, (res) => {
              console.log('API response status:', res.statusCode);
              let responseData = '';
              res.on('data', (chunk) => responseData += chunk);
              res.on('end', () => console.log('API response:', responseData));
            });
            
            req.on('error', (e) => console.error('API request error:', e.message));
            req.write(data);
            req.end();
          "
