name: Judge Submission

on:
  repository_dispatch:
    types: [judge-submission]

concurrency:
  group: judge-submission
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.set_result.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Record workflow start time
        run: |
          WORKFLOW_START_TIME=$(date +%s%3N)
          echo "WORKFLOW_START_TIME=$WORKFLOW_START_TIME" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ g++-9 php time && npm install node-fetch

      - name: Write submission data
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > submission.json
          node -e "
            const p = require('./submission.json');
            const fs = require('fs');
            const ext = { c: 'c', cpp: 'cpp', python3: 'py', java: 'java', javascript: 'js', typescript: 'ts', rust: 'rs', go: 'go' };
            const e = ext[p.language] || p.language;
            const fname = p.language === 'java' ? 'Main.java' : ('solution.' + e);
            fs.writeFileSync(fname, p.code);
            console.log('Wrote', fname, 'length', p.code.length);
          "

      - name: Run judge
        id: judge
        run: node .github/scripts/judge.js submission.json 2>&1 | tee judge_output.log
        continue-on-error: true

      - name: Capture compiler output
        if: always()
        run: |
          if [ -f judge_output.log ]; then
            echo "COMPILER_OUTPUT<<EOF" >> $GITHUB_ENV
            cat judge_output.log >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Upload result to API
        if: always() # 无论评测成功还是失败都执行
        env:
          COMPILER_OUTPUT: ${{ env.COMPILER_OUTPUT }}
          SUB_ID: ${{ github.event.client_payload.submissionId }}
          PROBLEM_ID: ${{ github.event.client_payload.problemId }}
          USER_ID: ${{ github.event.client_payload.userId }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_START_TIME: ${{ env.WORKFLOW_START_TIME }}
        run: |
          # 计算评测延迟：从workflow开始到评测完成
          if [ -n "$WORKFLOW_START_TIME" ]; then
            END_TIME=$(date +%s%3N)
            JUDGE_LATENCY_MS=$((END_TIME - WORKFLOW_START_TIME))
            echo "Workflow start: $WORKFLOW_START_TIME"
            echo "End time: $END_TIME"
            echo "Judge latency: ${JUDGE_LATENCY_MS}ms"
          else
            JUDGE_LATENCY_MS=0
            echo "No start time available"
          fi
          
          if [ -f judge_output.txt ]; then
            JUDGE_OUTPUT=$(cat judge_output.txt)
          else
            # 如果没有judge_output.txt，从编译器输出中提取结果
            if [ -f judge_output.log ]; then
              echo "Extracting from compiler output"
              JUDGE_OUTPUT=$(node -e "
                const fs = require('fs');
                const output = fs.readFileSync('judge_output.log', 'utf8');
                const match = output.match(/===JUDGE_RESULT===([\s\S]*?)$/);
                if (match) {
                  console.log(match[1].trim());
                } else {
                  console.log(JSON.stringify({status: 'compile_error', details: {passed: false, error: output}}));
                }
              ")
            else
              JUDGE_OUTPUT='{"status":"runtime_error","details":{"passed":false,"error":"No judge output file"}}'
            fi
          fi
          
          echo "Judge output: $JUDGE_OUTPUT"
          echo "Compiler output: $COMPILER_OUTPUT"
          echo "GitHub Run ID: $GITHUB_RUN_ID"
          echo "Judge latency: ${JUDGE_LATENCY_MS}ms"
          
          # Export judge latency for node script
          export JUDGE_LATENCY_MS
          
          node -e "
            const judgeOutput = process.env.JUDGE_OUTPUT || '{}';
            const compilerOutput = process.env.COMPILER_OUTPUT || '';
            const githubRunId = process.env.GITHUB_RUN_ID || '';
            const judgeLatencyMs = process.env.JUDGE_LATENCY_MS || '0';
            
            console.log('Environment JUDGE_LATENCY_MS:', judgeLatencyMs);
            
            let result;
            try {
              result = JSON.parse(judgeOutput);
            } catch (e) {
              console.error('Failed to parse judge output:', e);
              result = { status: 'runtime_error', details: { passed: false, error: 'Judge output parse error' } };
            }
            
            // 如果result details中有真实的测试点信息，使用它
            if (result.details && result.details.details && result.details.details.length > 0) {
              console.log('Using real test case details from judge output');
            } else if (compilerOutput) {
              const match = compilerOutput.match(/===JUDGE_RESULT===([\\s\\S]*?)$/);
              if (match) {
                try {
                  const compilerResult = JSON.parse(match[1]);
                  if (compilerResult.details && compilerResult.details.details) {
                    result.details = compilerResult.details;
                    result.status = compilerResult.status;
                    result.runTimeMs = compilerResult.runTimeMs;
                    result.memoryKb = compilerResult.memoryKb;
                    console.log('Extracted result from compiler output');
                  }
                } catch (e) {
                  console.error('Failed to parse compiler output:', e);
                }
              }
            }
            
            if (!result.details) {
              result.details = { passed: false, details: [] };
            }
            
            if (result.details.error) {
              let errorText = result.details.error;
              errorText = errorText.replace(/[\\u2018\\u2019]/g, \"'\");
              errorText = errorText.replace(/[\\u201C\\u201D]/g, '\"');
              errorText = errorText.replace(/[\\u2013\\u2014]/g, '-');
              errorText = errorText.replace(/[\\u2026]/g, '...');
              errorText = errorText.replace(/[\\u2192]/g, '->');
              errorText = errorText.replace(/[\\u00D7]/g, 'x');
              errorText = errorText.replace(/[\\u00F7]/g, '/');
              
              if (errorText.length > 500) {
                errorText = errorText.substring(0, 500) + '... (error truncated)';
              }
              
              result.details.error = errorText;
            }
            
            const body = {
              submissionId: Number(process.env.SUB_ID),
              problemId: Number(process.env.PROBLEM_ID),
              userId: Number(process.env.USER_ID),
              status: result.status || 'runtime_error',
              resultJson: JSON.stringify(result.details),
              runTimeMs: result.runTimeMs !== undefined ? result.runTimeMs : null,
              memoryKb: result.memoryKb !== undefined ? result.memoryKb : null,
              accepted: result.status === 'accepted',
              githubRunId: githubRunId,
              judgeLatencyMs: Number(judgeLatencyMs)
            };
            
            try {
              JSON.parse(body.resultJson);
            } catch (e) {
              console.error('Invalid resultJson:', e);
              // 如果JSON解析失败，尝试修复常见问题
              try {
                const parsedDetails = JSON.parse(body.resultJson);
                body.resultJson = JSON.stringify(parsedDetails);
              } catch (e2) {
                console.error('Failed to fix resultJson:', e2);
                body.resultJson = JSON.stringify({
                  passed: false,
                  error: '评测结果格式错误',
                  details: []
                });
              }
            }
            
            console.log('Sending result to API:', JSON.stringify(body, null, 2));
            
            const https = require('https');
            const data = Buffer.from(JSON.stringify(body), 'utf8');
            
            const options = {
              hostname: 'api.csp.qzz.io',
              port: 443,
              path: '/api/webhooks/judge',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                'Content-Length': data.length,
                'Authorization': 'Bearer ' + process.env.API_TOKEN
              }
            };
            
            const req = https.request(options, (res) => {
              console.log('API response status:', res.statusCode);
              let responseData = '';
              res.on('data', (chunk) => responseData += chunk);
              res.on('end', () => console.log('API response:', responseData));
            });
            
            req.on('error', (e) => console.error('API request error:', e.message));
            req.write(data);
            req.end();
          "
